name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build self-test executable
        shell: pwsh
        run: .\build.ps1 -Console

      - name: Run self-tests
        shell: pwsh
        run: .\dist\XMG_ADB.Tests.exe /selftest

      - name: Check XAML pages and themes
        shell: pwsh
        run: .\dist\XMG_ADB.Tests.exe /uitest

      - name: Build desktop application
        shell: pwsh
        run: .\build.ps1

      - name: Upload application artifact
        uses: actions/upload-artifact@v4
        with:
          name: XMG_ADB
          path: dist/XMG_ADB.exe
